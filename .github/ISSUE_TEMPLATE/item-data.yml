name: Share item data
description: Attach an item export so the Version Upgrade preview knows more affix tiers (fills in the ? and a~b ranges).
title: "Item data: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Every tier range the script knows comes from items players have exported, and one
        account only ever sees a small part of them. Items from late-game zones, high item levels, T1/T0 affixes,
        signatures, extensions and special implicits are the most useful.

        **How to make the export**

        1. Open your **Inventory** once, so the game loads it.
        2. Browse the **Marketplace**: page size 100, and different slots and sort orders. The script collects
           every item you see, including items in chat links and new drops.
        3. **Don't reload the page yet.** The collected items are only kept until the page reloads.
        4. Open **INFO DISPLAY** at the bottom of the game's left menu and click **EXPORT ITEMS**. It saves
           `idlehacking-affixes-<time>.json.gz` to your downloads.
        5. Drag that file into the box below.

        The export holds the items exactly as the game sent them, minus the "found by" and "enhanced by" player names.
  - type: textarea
    id: file
    attributes:
      label: Export file
      description: Drag the .json.gz file here (GitHub takes files up to 25 MB). Several files are fine.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
      description: Shown at the top of the INFO DISPLAY page (left menu).
      placeholder: "0.3.0"
  - type: textarea
    id: notes
    attributes:
      label: Anything unusual?
      description: >-
        For example, a range that doesn't match what the game shows, an affix the bias tags don't know, or
        what you browsed (slots, item levels).
